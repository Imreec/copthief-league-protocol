# One sparring peer, waiting for YOUR implementation to dial it.
#
#     docker compose -f sparring/docker-compose.await.yml up
#
# Point your peer at  http://localhost:8931/mcp  (or host.docker.internal from inside a container).
#
# If you expose this through a tunnel to play from elsewhere, rewrite the Host header or fastmcp
# answers 421 to every request — its DNS-rebinding guard rejects any Host that is not its bind
# address, which is every request arriving through a tunnel:
#
#     Cloudflare   originRequest.httpHostHeader: 127.0.0.1:8931
#     ngrok        --host-header=rewrite
#
# (SPEC Appendix D. It is the single most common first-contact failure between two teams.)
#
# Expect NO report from this host. Sparring is an uncounted warm-up (App. E rule 52), so nothing
# is owed by either side — and point your OWN mail at yourselves or at nothing while practising,
# never at the lecturer. See docs/WARNINGS.md.

services:
  sparring:
    build:
      context: ..
      dockerfile: sparring/Dockerfile
    command:
      - serve
      - --host=0.0.0.0
      - --port=8931
      - --await-peer
      - --role=alternate
      - --artifacts=/kit/runs
    ports:
      - "8931:8931"
    volumes:
      - ./runs:/kit/runs
